name: Download postal code

on:
  push:
    branches:
      - main
      - workflows
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
    - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
      with:
        node-version: '24.x'
        cache: 'pnpm'

    - run: pnpm install --frozen-lockfile

    - name: Create Directory
      run: mkdir -p packages/downloader/out/json

    - name: Download
      run: pnpm --filter @japan-d2/postalcode-downloader run download

    - name: Extract JSON Files
      run: unzip -o packages/downloader/out/postalcode.zip -d packages/downloader/out/json/ > /dev/null

    - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: postalcode.zip
        path: packages/downloader/out/postalcode.zip

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
      with:
        path: packages/downloader/out/json

  deploy:
    needs: download
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
