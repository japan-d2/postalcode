name: Download postal code

on:
  push:
    branches:
      - main
      - workflows
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24.x'
        cache: 'pnpm'

    - run: pnpm install --frozen-lockfile

    - name: Create Directory
      run: mkdir -p packages/downloader/out/json

    - name: Download
      run: pnpm --filter @japan-d2/postalcode-downloader run download

    - name: Extract JSON Files
      run: unzip -o packages/downloader/out/postalcode.zip -d packages/downloader/out/json/ > /dev/null

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: postalcode.zip
        path: packages/downloader/out/postalcode.zip

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: packages/downloader/out/json

  deploy:
    needs: download
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
